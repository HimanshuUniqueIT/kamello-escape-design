<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 16px; align-items: start"><section style="background: #FFFFFF; border: 1px solid #D3DEDF; border-radius: 8px; padding: 20px; min-width: 0; box-sizing: border-box; "><div style="display: flex; flex-direction: column; gap: 16px; min-width: 0"><h2 style="margin: 0; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-size: 19px; font-weight: 600; color: #14323C">Your details</h2><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 16px; align-items: start"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="pf-first" style="font-size: 13.5px; font-weight: 600; color: #14323C">First name</label><input id="pf-first" type="text" value="Alicia" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 0 12px; border: 1px solid #9DB0B6; border-radius: 6px; font: inherit; color: #14323C; background: #FFFFFF"></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="pf-last" style="font-size: 13.5px; font-weight: 600; color: #14323C">Last name</label><input id="pf-last" type="text" value="Rolle" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 0 12px; border: 1px solid #9DB0B6; border-radius: 6px; font: inherit; color: #14323C; background: #FFFFFF"></div></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="pf-email" style="font-size: 13.5px; font-weight: 600; color: #14323C">Email</label><input id="pf-email" type="email" value="alicia.rolle@example.com" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 0 12px; border: 1px solid #9DB0B6; border-radius: 6px; font: inherit; color: #14323C; background: #FFFFFF"></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="pf-phone" style="font-size: 13.5px; font-weight: 600; color: #14323C">Phone</label><input id="pf-phone" type="tel" value="+1 242 555 0142" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 0 12px; border: 1px solid #9DB0B6; border-radius: 6px; font: inherit; color: #14323C; background: #FFFFFF"></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="pf-address" style="font-size: 13.5px; font-weight: 600; color: #14323C">Address</label><input id="pf-address" type="text" value="14 Village Road, Nassau" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 0 12px; border: 1px solid #9DB0B6; border-radius: 6px; font: inherit; color: #14323C; background: #FFFFFF"></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="pf-country" style="font-size: 13.5px; font-weight: 600; color: #14323C">Country</label><input id="pf-country" type="text" value="Bahamas" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 0 12px; border: 1px solid #9DB0B6; border-radius: 6px; font: inherit; color: #14323C; background: #FFFFFF"></div></div></section><section style="background: #FFFFFF; border: 1px solid #D3DEDF; border-radius: 8px; padding: 20px; min-width: 0; box-sizing: border-box; "><div style="display: flex; flex-direction: column; gap: 16px; min-width: 0"><h2 style="margin: 0; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-size: 19px; font-weight: 600; color: #14323C">Password</h2><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="pf-current" style="font-size: 13.5px; font-weight: 600; color: #14323C">Current password</label><input id="pf-current" type="password" value="" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 0 12px; border: 1px solid #9DB0B6; border-radius: 6px; font: inherit; color: #14323C; background: #FFFFFF"></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="pf-new" style="font-size: 13.5px; font-weight: 600; color: #14323C">New password</label><input id="pf-new" type="password" value="" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 0 12px; border: 1px solid #9DB0B6; border-radius: 6px; font: inherit; color: #14323C; background: #FFFFFF"></div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; "><a href="Portal-Profile.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 6px; font-weight: 600; font-size: 15px; text-decoration: none; background: #FFFFFF; color: #14323C; border: 1px solid #9DB0B6">Change password</a></div></div></section></div>
