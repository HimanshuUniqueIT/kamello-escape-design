<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer login | Ka&#39;Mello Escape</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F3F7F6}
a{color:#0A6E75}a:hover{color:#074F54}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #F6C453;outline-offset:2px}

.lg-role{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#E3EBEC;border-radius:10px}
.lg-role input{position:absolute;opacity:0;pointer-events:none}
.lg-role label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:7px;cursor:pointer;font-size:15px;font-weight:600;color:#4B626C;transition:background .15s,color .15s}
.lg-role label span{font-size:12px;font-weight:500}
.lg-role input:checked+label{background:#FFFFFF;color:#14323C;box-shadow:0 1px 3px rgba(12,43,54,.15)}
.lg-role input:focus-visible+label{outline:3px solid #F6C453;outline-offset:2px}
</style>

</head>
<body>

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #0C2B36; color: #14323C; font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif">
<div style="flex: 1 1 340px; padding: 48px clamp(20px, 5vw, 72px); box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 32px"><img src="assets/logo-full.png" alt="Ka&#39;Mello Escapes" width="220" style="display: block; width: 220px; max-width: 100%; height: auto"><div style="font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-size: clamp(30px, 4vw, 48px); line-height: 1.08; font-weight: 500; color: #FFFFFF; text-wrap: balance" id="lg-tag">Your trip, your documents and your payments.</div></div>
<div style="flex: 1 1 400px; background: #F3F7F6; padding: 48px clamp(20px, 5vw, 72px); box-sizing: border-box; display: flex; align-items: center"><form id="lg-f" style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px"><div class="lg-role" role="radiogroup" aria-label="Log in as"><input type="radio" name="role" id="r-cust" value="customer" checked><label for="r-cust">Customer<span>My trips and payments</span></label><input type="radio" name="role" id="r-admin" value="admin"><label for="r-admin">Admin<span>Agency team</span></label></div><h1 id="lg-h" style="margin: 0; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-size: 28px; font-weight: 600">Log in to your trip</h1><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="pl-email" style="font-size: 13.5px; font-weight: 600; color: #14323C">Email</label><input id="pl-email" type="email" value="alicia.rolle@example.com" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 0 12px; border: 1px solid #9DB0B6; border-radius: 6px; font: inherit; color: #14323C; background: #FFFFFF"></div><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="pl-pass" style="font-size: 13.5px; font-weight: 600; color: #14323C">Password</label><input id="pl-pass" type="password" value="" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 0 12px; border: 1px solid #9DB0B6; border-radius: 6px; font: inherit; color: #14323C; background: #FFFFFF"></div><a id="lg-go" href="Portal-Dashboard.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 6px; font-weight: 600; font-size: 15px; text-decoration: none; background: #0A6E75; color: #FFFFFF; border: 1px solid #0A6E75">Log in</a><div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px"><a href="Auth-Reset.html" style="color: #0A6E75; font-weight: 600">Forgot password?</a></div></form></div></div>

<script>(function(){
var R={customer:{h:'Log in to your trip',tag:'Your trip, your documents and your payments.',email:'alicia.rolle@example.com',go:'Portal-Dashboard.html',btn:'Log in'},
admin:{h:'Log in to the admin panel',tag:'Bookings, customers and payments in one place.',email:'ricardo@kamelloescapes.com',go:'Admin-Dashboard.html',btn:'Log in as admin'}};
var $=function(i){return document.getElementById(i)};
function set(r){var c=R[r];$('lg-h').textContent=c.h;$('lg-tag').textContent=c.tag;$('pl-email').value=c.email;$('lg-go').href=c.go;$('lg-go').textContent=c.btn;document.title=(r==='admin'?'Admin login':'Customer login')+' | Ka’Mello Escape';history.replaceState(null,'','?as='+r);}
document.querySelectorAll('input[name=role]').forEach(function(i){i.addEventListener('change',function(){set(i.value)})});
var start=new URLSearchParams(location.search).get('as')==='admin'?'admin':'customer';$(start==='admin'?'r-admin':'r-cust').checked=true;set(start);
$('lg-f').addEventListener('submit',function(e){e.preventDefault();location.href=$('lg-go').href});
})();</script>
</body>
</html>
